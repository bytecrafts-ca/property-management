name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build:pages
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: "/property-management"
          NEXT_PUBLIC_FIREBASE_API_KEY: "AIzaSyAe7vzB11y-meA38U7hAObEVIrtxfXuf9s"
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "whitby-link-ca.firebaseapp.com"
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "whitby-link-ca"
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "whitby-link-ca.firebasestorage.app"
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "254042083047"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:254042083047:web:dd427191b3f6b0d3411c42"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
